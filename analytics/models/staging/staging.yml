models:
  - name: stg_job_postings
    description: >
      One row per posting per scrape day - a job re-scraped across days 
      keeps every row. 
    columns:
      - name: job_id
        description: The scrapers posting id.
      - name: search_term
        description: The role the scraper searched for; three values by construction.
      - name: search_date
        description: Scrape day.
      - name: searched_at
        description: Scrape timestamp (search_time renamed).
      - name: search_location
        description: Location parameter the scraper searched under.
      - name: job_title
        description: Posting title as scraped.
      - name: company_name
        description: Employer name, trimmed.
      - name: job_location
        description: Posting location as scraped.
      - name: source_platform
        description: Posting platform (job_via with the 'via ' scraper artifact stripped, ~6.3k rows).
      - name: job_schedule_type
        description: As scraped; 12,252 nulls stay null - documented, not fixed.
      - name: job_work_from_home
        description: True when the posting is flagged remote.
      - name: job_posted_at
        description: Raw relative posted time ('10 hours ago'), kept unparsed - search_date carries the time axis; parsing it is a supporter exercise.
      - name: job_salary
        description: Raw salary text, unparsed for now.
      - name: salary_min
        description: Lower bound parsed from the salary text; the single value when no range is given.
      - name: salary_max
        description: Upper bound parsed from the salary text; the single value when no range is given.
      - name: salary_avg
        description: >
          THE standard salary measure: midpoint of the parsed range (a single value is its
          own range). Deliberately unit-agnostic - always pair it with salary_period and
          salary_currency filters; averaging across periods or currencies is mixing units.
      - name: salary_period
        description: "Pay period parsed from the salary text: year, hour, month, day, or week."
      - name: salary_currency
        description: >
          Currency of the salary columns. Leading marker when present ('PKR', 'CA$', '₱');
          a salaried row with no marker is stamped 'USD' - an explicit, documented assumption.
          Null only when the row has no salary at all.
      - name: has_health_insurance
        description: Posting lists Health insurance among its extensions.
      - name: has_dental_insurance
        description: Posting lists Dental insurance among its extensions.
      - name: has_paid_time_off
        description: Posting lists Paid time off among its extensions.
      - name: has_no_degree_mentioned
        description: Posting lists No degree mentioned among its extensions.

  - name: stg_job_skills
    description: >
      One row per (job_id, skill_id) pair, straight off the raw table.
      Deliberately boring; rename, order, trim is the discipline working.
    columns:
      - name: job_id
        description: Every pair's parent exists in stg_job_postings - the export's join guarantees it.
      - name: skill_id
        description: Skill key for the pair; the human-readable text rides in skill_keyword.
      - name: skill_keyword
        description: Skill text as extracted, trimmed.